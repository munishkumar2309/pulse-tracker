# Builds the Pulse APK on every push to main (and on demand).
# Download: GitHub → Actions → latest "Android APK" run → Artifacts → pulse-apk.
name: Android APK

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install
        run: npm ci

      - name: Unit tests
        run: npm test

      # Food photo model (dima806/indian_food_image_detection → ONNX int8, about 90 MB) bundled into the APK,
      # so photos work offline from the first use. Cached between runs; re-exported only when the script changes.
      # If the export fails, the APK is still built and the app downloads the model on first use instead.
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      # restore + save (not actions/cache) so a failed export is never cached.
      - name: Restore food model
        id: food-model-cache
        uses: actions/cache/restore@v4
        with:
          path: public/models
          key: food-model-v2-${{ hashFiles('scripts/export-food-model.py') }}

      - name: Export food photo model
        id: food-model
        if: steps.food-model-cache.outputs.cache-hit != 'true'
        continue-on-error: true
        run: |
          pip install --index-url https://download.pytorch.org/whl/cpu torch==2.15.0
          pip install "optimum-onnx[onnxruntime]==0.1.0" transformers==4.57.6
          npm run export:food-model

      - name: Save food model
        if: steps.food-model.outcome == 'success'
        uses: actions/cache/save@v4
        with:
          path: public/models
          key: food-model-v2-${{ hashFiles('scripts/export-food-model.py') }}

      - name: Warn if the food model is missing
        if: steps.food-model.outcome == 'failure'
        run: |
          rm -rf public/models
          echo "::warning::Food model export failed. This APK will download the model from Hugging Face on the first photo."

      - name: Check food model labels
        if: hashFiles('public/models/**/labels.json') != ''
        run: node scripts/check-food-labels.mjs

      - name: Build web app
        run: npm run build

      - name: Copy web app into Android project
        run: npx cap sync android

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: gradle

      - name: Build signed APK
        working-directory: android
        env:
          PULSE_KEYSTORE_PASSWORD: ${{ secrets.PULSE_KEYSTORE_PASSWORD }}
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon --stacktrace

      - name: Rename APK
        run: cp android/app/build/outputs/apk/release/app-release.apk "pulse-${{ github.run_number }}.apk"

      - uses: actions/upload-artifact@v4
        with:
          name: pulse-apk
          path: pulse-${{ github.run_number }}.apk
          retention-days: 30
